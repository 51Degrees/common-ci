name: Bump version
inputs:
  format:
    type: string
    default: '{SemVer}'
  mode:
    type: string
    default: ContinuousDeployment
  args:
    type: string
outputs:
  version:
    value: ${{ steps.bump.outputs.version }}
  bumped:
    value: ${{ steps.bump.outputs.bumped }} # 'yes' if the version doesn't exist as a tag in the repo, otherwise empty
runs:
  using: "composite"
  steps:
    - id: bump
      shell: bash
      env:
        _51DEGREES_FORMAT: ${{ inputs.format }}
        _51DEGREES_MODE: ${{ inputs.mode }}
        _51DEGREES_ARGS: ${{ inputs.args }}
      run: |
        # GitVersion 7 takes POSIX-style arguments and refuses /format, so
        # stay on the 6.x release steps/install-gitversion.ps1 pins until this
        # step moves to the new form.
        pwsh -NoProfile -File "$GITHUB_ACTION_PATH/../../steps/install-gitversion.ps1"
        version=$(dotnet-gitversion /format "$_51DEGREES_FORMAT" /overrideconfig "mode=$_51DEGREES_MODE" $_51DEGREES_ARGS)
        tee -a "$GITHUB_OUTPUT" <<<"version=$version"
        git show-ref --quiet --tags "$version" || tee -a "$GITHUB_OUTPUT" <<<"bumped=yes"

