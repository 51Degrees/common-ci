name: Compare performance
inputs:
  metrics:
    required: true
  save:
    default: false
  branch:
    default: performance-results
runs:
  using: "composite"
  steps:
    - shell: pwsh
      env:
        _51DEGREES_METRICS: ${{ inputs.metrics }}
        _51DEGREES_SAVE: ${{ inputs.save }}
        _51DEGREES_BRANCH: ${{ inputs.branch }}
      run: . '${{ github.action_path }}/compare-performance.ps1'

