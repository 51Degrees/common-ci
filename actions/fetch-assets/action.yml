name: Fetch Assets
inputs:
  assets:
    required: true
  cache:
    required: false
  lazy: # don't actually fetch if the files are cached
    required: false
  encryption-key:
    # With cache, the key every asset that is not free is encrypted with in
    # the cache, from the CACHE_ENCRYPTION_KEY secret. Without it, assets that
    # are not all free are not saved to the cache, and a restore brings back
    # the free files alone, with a warning, and the fetch step downloads the
    # rest. It takes no part in the cache key.
    required: false
    default: ''
  cache-key:
    # With cache, the key of the entry to restore, being the cache-key output
    # of a fetch-assets step in an earlier job of the run. The step then takes
    # every asset from that entry, downloads none and saves nothing, and fails
    # naming any asset the entry lacks. Assets that are not free need the
    # same encryption-key the entry was saved with. lazy has no effect with
    # it, and it needs cache.
    required: false
    default: ''
outputs:
  cache-key:
    # With cache, the key of the entry the assets are cached under, for a
    # later job to pass back as the cache-key input. It is empty when no
    # entry exists, as when assets that are not free were not saved for want
    # of an encryption-key.
    value: ${{ inputs.cache-key || ((steps.cache-restore.outputs.cache-hit == 'true' || steps.encrypt-assets.outputs.ready == 'true') && steps.hash-inputs.outputs.key) || '' }}
runs:
  using: "composite"
  steps:
    - name: Hash inputs
      id: hash-inputs
      if: ${{ inputs.cache == 'true' && inputs.cache-key == '' }}
      shell: pwsh
      env:
        _51DEGREES_ASSETS: ${{ inputs.assets }}
        _51DEGREES_CACHE: ${{ inputs.cache }}
      run: |
        $sha1 = [Security.Cryptography.SHA1Managed]::new()
        $key = @($env:_51DEGREES_ASSETS, $env:_51DEGREES_CACHE).Where({$_}) | Sort-Object | Join-String -Separator `n
        $hash = [Convert]::ToHexString($sha1.ComputeHash([Text.Encoding]::Utf8.GetBytes($key)))
        "key=$(Get-Date -Format FileDate)-$hash" >> $env:GITHUB_OUTPUT

    - name: Restore cache
      id: cache-restore
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache/restore@v5
      with:
        key: ${{ inputs.cache-key || steps.hash-inputs.outputs.key }}
        path: asset-cache
        enableCrossOsArchive: true
        lookup-only: ${{ inputs.lazy == 'true' && inputs.cache-key == '' }}
        fail-on-cache-miss: ${{ inputs.cache-key != '' }}

    # Given the key of an entry, the names of the files the entry holds, so
    # that a missing asset is told apart from one held but not decrypted.
    - name: List the cache entry
      id: list-entry
      if: ${{ inputs.cache-key != '' && steps.cache-restore.outputs.cache-hit == 'true' }}
      shell: pwsh
      run: |
        $held = @(Get-ChildItem -LiteralPath asset-cache -File -Force |
            Where-Object { $_.Name -ne 'encrypted.json' -and $_.Extension -ne '.enc' } |
            ForEach-Object Name)
        $manifest = Join-Path asset-cache encrypted.json
        if (Test-Path -LiteralPath $manifest) {
            $held += @((Get-Content -Raw -LiteralPath $manifest | ConvertFrom-Json -AsHashtable).Keys)
        }
        "held=$(ConvertTo-Json -Compress -InputObject @($held | Sort-Object -Unique))" >> $env:GITHUB_OUTPUT

    # The free files come out of the cache as they are, and every other file
    # is decrypted.
    - name: Decrypt assets
      if: ${{ inputs.cache == 'true' && (inputs.lazy != 'true' || inputs.cache-key != '') && steps.cache-restore.outputs.cache-hit == 'true' }}
      shell: pwsh
      env:
        CACHE_ENCRYPTION_KEY: ${{ inputs.encryption-key }}
      run: |
        & "${{ github.action_path }}/../../steps/asset-cache.ps1" -Restore

    # Given the key of an entry, every asset comes from that entry, so one
    # that is missing fails the step rather than being downloaded. The
    # message says whether the entry lacks it or holds it encrypted.
    - name: Check the restored assets
      if: ${{ inputs.cache-key != '' }}
      shell: pwsh
      env:
        _51DEGREES_ASSETS: ${{ inputs.assets }}
        _51DEGREES_CACHE: ${{ inputs.cache }}
        _51DEGREES_ENTRY: ${{ steps.list-entry.outputs.held }}
      run: |
        if ($env:_51DEGREES_CACHE -ne 'true') {
            throw "cache-key needs cache set to true, and a step given cache-key never downloads an asset."
        }
        $held = @($env:_51DEGREES_ENTRY ? ($env:_51DEGREES_ENTRY | ConvertFrom-Json) : @())
        $missing = @($env:_51DEGREES_ASSETS.Trim() -split "`n" | ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not (Test-Path -LiteralPath "assets/$_" -PathType Leaf) })
        $encrypted = @($missing | Where-Object { $_ -cin $held })
        $absent = @($missing | Where-Object { $_ -cnotin $held })
        if ($encrypted) {
            Write-Output "::error::The asset cache entry holds $($encrypted -join ', ') encrypted, and they were not decrypted, because encryption-key was not given or is not the key the entry was saved with. The warning above says which."
        }
        if ($absent) {
            Write-Output "::error::The asset cache entry does not hold $($absent -join ', ')."
        }
        if ($missing) {
            throw "A step given cache-key never downloads an asset, so the assets missing from the entry fail it: $($missing -join ', ')"
        }

    # The licensed files come from the Distributor with _51DEGREES_LICENSE_KEY,
    # which the calling step sets from the source secret that carries the
    # products it downloads, LICENSE_KEY_V4TAC_IPIV4ENTERPRISE for the data
    # files.
    - name: Fetch assets
      if: ${{ inputs.cache-key == '' && (!inputs.lazy || steps.cache-restore.outputs.cache-hit != 'true') }}
      shell: pwsh
      env:
        _51DEGREES_ASSETS: ${{ inputs.assets }}
      run: |
        & "${{ github.action_path }}/../../steps/fetch-assets.ps1" -Assets ($env:_51DEGREES_ASSETS.Trim() -split "`n")

    - name: Encrypt assets
      id: encrypt-assets
      if: ${{ inputs.cache == 'true' && inputs.cache-key == '' && steps.cache-restore.outputs.cache-hit != 'true' }}
      shell: pwsh
      env:
        CACHE_ENCRYPTION_KEY: ${{ inputs.encryption-key }}
      run: |
        $ready = & "${{ github.action_path }}/../../steps/asset-cache.ps1" -Save
        "ready=$("$ready".ToLower())" >> $env:GITHUB_OUTPUT

    - name: Save cache
      if: ${{ steps.encrypt-assets.outputs.ready == 'true' }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.hash-inputs.outputs.key }}
        path: asset-cache
        enableCrossOsArchive: true

    # The copy the cache saved is not needed by the rest of the job.
    - name: Remove the cache folder
      if: ${{ always() && steps.encrypt-assets.outputs.ready == 'true' }}
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force asset-cache -ErrorAction SilentlyContinue
