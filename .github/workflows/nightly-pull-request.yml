name: Nightly Pull Request

on:
  workflow_call:
    inputs:
      repo-name:
        required: true
        type: string
      pull-request-id:
        required: true
        type: number
      org-name:
        type: string
        default: 51degrees
      user:
        type: string
        default: Automation51D
      email:
        type: string
        default: "51DCI@51Degrees.com"
      dryrun:
        type: string
        default: false
      cache-assets:
        default: false
        type: boolean
      common-ci-ref:
        type: string
        default: ''
      branch: # Branch to use if not one calling this
        type: string
        default: ''
      performance-branch:
        description: 'Branch whose performance history the results are compared with; empty uses branch'
        type: string
        default: ''
      build-test-timeout-minutes:
        type: number
        default: 120
      skip-compare-performance:
        type: boolean
        default: false
      skip-lite-tests:
        type: boolean
        default: false
      examples-branch:
        description: 'Examples repo branch for the tests; empty keeps the one in options.json'
        type: string
        default: ''
      fail-fast:
        description: 'Cancel the other configurations when one fails'
        type: boolean
        default: true
      full-matrix:
        description: 'Build every entry in ci/options.json, even where ci/select-options.ps1 would choose fewer'
        type: boolean
        default: false

defaults:
  run:
    shell: pwsh

jobs:
  Configure:
    name : Configure - ${{ inputs.pull-request-id }}
    runs-on: ubuntu-latest
    outputs:
      options: ${{ steps.configure.outputs.options }}
      build: ${{ steps.configure.outputs.build }}
      asset_cache_key: ${{ steps.prefetch-assets.outputs.cache-key }}
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.org-name }}/common-ci
          ref: ${{ inputs.common-ci-ref }}

      - name: Configure
        id: configure
        env:
          CI_ACCESS_TOKEN: ${{ secrets.CI_ACCESS_TOKEN }}
        run: |
          $FullMatrix = [bool]::Parse("${{ inputs.full-matrix }}")
          ./nightly-pull-request.configure-pr.ps1 `
          -RepoName ${{ inputs.repo-name }} `
          -OrgName ${{ inputs.org-name }} `
          -Branch ${{ inputs.branch != '' && inputs.branch || github.ref_name }} `
          -GitHubOutput $Env:GITHUB_OUTPUT `
          -PullRequestId ${{ inputs.pull-request-id }} `
          -GitHubUser ${{ inputs.user }} `
          -GitHubEmail ${{ inputs.email }} `
          -FullMatrix $FullMatrix

      - name: Prefetch assets
        id: prefetch-assets
        if: inputs.cache-assets
        uses: ./.github/actions/prefetch_assets
        with:
          repo: ${{ inputs.repo-name }}
          secrets: ${{ toJSON(secrets) }}
          vars: ${{ toJSON(vars) }}
          license-key: ${{ secrets.LICENSE_KEY_V4TAC_IPIV4ENTERPRISE }}
          encryption-key: ${{ secrets.CACHE_ENCRYPTION_KEY }}

  BuildAndTest:
    needs: Configure
    # Configure chose no entry, as for a change to documentation alone.
    if: needs.Configure.outputs.build != 'false'
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        options: ${{ fromJSON(needs.configure.outputs.options ) }}
    name: Build and Test - ${{ inputs.pull-request-id }} - ${{ matrix.options.name }}
    runs-on: ${{ matrix.options.image }}
    timeout-minutes: ${{ inputs.build-test-timeout-minutes }}
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.org-name }}/common-ci
          ref: ${{ inputs.common-ci-ref }}

      - name: Install Runtime
        if: matrix.options.Language != '' && matrix.options.LanguageVersion != ''
        uses: ./.github/actions/install_runtime
        with:
          language: ${{ matrix.options.Language }}
          version: ${{ matrix.options.LanguageVersion }}

      - name: Restore Asset Cache
        if: needs.configure.outputs.asset_cache_key
        uses: actions/cache/restore@v5
        with:
          key: ${{ needs.configure.outputs.asset_cache_key }}
          path: asset-cache
          enableCrossOsArchive: true

      # The free files come out of the cache as they are, and every other
      # file is decrypted with the key it was saved with.
      - name: Decrypt Asset Cache
        if: needs.configure.outputs.asset_cache_key
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: ./steps/asset-cache.ps1 -Restore

      # The CI secrets the repository's own build and test scripts read, as
      # its ci/ci-secrets.psd1 lists them on the branch the pull request goes
      # into.
      - name: Read the repository's list of CI secrets
        env:
          GH_TOKEN: ${{ secrets.CI_ACCESS_TOKEN }}
          _51DEGREES_REPOSITORY: ${{ inputs.org-name }}/${{ inputs.repo-name }}
          _51DEGREES_REF: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}
        run: ./steps/get-caller-ci-secrets.ps1 -Repository $env:_51DEGREES_REPOSITORY -Ref $env:_51DEGREES_REF -Path caller-ci-secrets.psd1

      # The secrets and variables, each under its own name, for the
      # steps that follow. The secrets context is read here alone.
      - name: Export secrets and variables
        env:
          _51DEGREES_SECRETS: ${{ toJSON(secrets) }}
          _51DEGREES_VARS: ${{ toJSON(vars) }}
        run: ./steps/export-secrets.ps1 -Secrets $env:_51DEGREES_SECRETS -Vars $env:_51DEGREES_VARS -CallerList caller-ci-secrets.psd1

      - name: Build and Test
        id: build-and-test
        env:
          # Through env rather than inline, so the branch name is never
          # parsed as PowerShell.
          _51DEGREES_EXAMPLES_BRANCH: ${{ inputs.examples-branch }}
          # The data file license, for the data file downloads and the data
          # file update example tests that this step runs.
          _51DEGREES_LICENSE_KEY: ${{ secrets.LICENSE_KEY_V4TAC_IPIV4ENTERPRISE }}
        run: |
          $DryRun = [bool]::Parse( "${{ inputs.dryrun }}" )
          $Options = $(ConvertFrom-Json -AsHashtable '${{ toJSON(matrix.options) }}')
          # Overrides every matrix entry. run-script.ps1 only hands it to
          # scripts declaring an ExamplesBranch parameter, so repos without
          # one are unaffected.
          if ([string]::IsNullOrEmpty($env:_51DEGREES_EXAMPLES_BRANCH) -eq $false)
          {
            $Options["ExamplesBranch"] = $env:_51DEGREES_EXAMPLES_BRANCH
          }
          $SkipLiteTests = [bool]::Parse("${{ inputs.skip-lite-tests }}")
          ./nightly-pull-request.build-and-test.ps1 `
          -RepoName ${{ inputs.repo-name }} `
          -OrgName ${{ inputs.org-name }} `
          -Branch ${{ inputs.branch != '' && inputs.branch || github.ref_name }} `
          -GitHubOutput $Env:GITHUB_OUTPUT `
          -PullRequestId ${{ inputs.pull-request-id }} `
          -Options $Options `
          -GitHubUser ${{ inputs.user }} `
          -GitHubEmail ${{ inputs.email }} `
          -DryRun $DryRun `
          -SkipLiteTests $SkipLiteTests

      - name: Publish Test Results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/publish_test_results
        with:
          repo-name: ${{ inputs.repo-name }}
          name: ${{ matrix.options.name }}
          commit: ${{ steps.build-and-test.outputs.pr-sha }}
          skip-performance: ${{ !matrix.options.runperformance }}

      - name: Upload Performance Results Artifact
        uses: actions/upload-artifact@v7
        if: ${{ matrix.options.runperformance }}
        with:
          name: performance_results-${{ inputs.pull-request-id }}-${{ matrix.options.name }}
          path: ${{ github.workspace }}/${{ inputs.repo-name }}/test-results/performance-summary/results_*.json
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ inputs.pull-request-id }}-${{ matrix.options.name }}
          path: ${{ github.workspace }}/${{ inputs.repo-name }}/artifacts/*
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true

  ComparePerformance:
    runs-on: ubuntu-latest
    needs: [ Configure, BuildAndTest ]
    if: ${{ !inputs.skip-compare-performance && contains(fromJSON(needs.Configure.outputs.options).*.RunPerformance, true) }}
    name: Compare Performance - ${{ inputs.pull-request-id }}
    outputs:
      outcome: ${{ steps.compare.outcome }}
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.org-name }}/common-ci
          ref: ${{ inputs.common-ci-ref }}

      - name: Download Performance Results Artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: performance_results-${{ inputs.pull-request-id }}-*
          merge-multiple: true

      # A failed comparison must not stop a merge or a release, because figures
      # vary too much between runners. ReportComparePerformance turns the run red.
      - name: Compare Performance
        id: compare
        continue-on-error: true
        env:
          CI_ACCESS_TOKEN: ${{ secrets.CI_ACCESS_TOKEN }}
        run: |
          $DryRun = [bool]::Parse( "${{ inputs.dryrun }}" )
          $Options = $(ConvertFrom-Json -AsHashtable '${{ needs.configure.outputs.options }}')
          ./nightly-pull-request.compare-performance.ps1 `
          -RepoName ${{ inputs.repo-name }} `
          -OrgName ${{ inputs.org-name }} `
          -Branch ${{ inputs.performance-branch != '' && inputs.performance-branch || (inputs.branch != '' && inputs.branch || github.ref_name) }} `
          -GitHubOutput $Env:GITHUB_OUTPUT `
          -Options $Options `
          -RunId ${{ github.run_id }} `
          -GitHubUser ${{ inputs.user }} `
          -GitHubEmail ${{ inputs.email }} `
          -DryRun $DryRun

  ReportComparePerformance:
    name: Report Compare Performance - ${{ inputs.pull-request-id }}
    runs-on: ubuntu-latest
    needs: ComparePerformance
    if: ${{ !cancelled() && needs.ComparePerformance.outputs.outcome == 'failure' }}
    steps:
      - name: Report Failure
        run: |
          Write-Output "::error title=Compare Performance failed::See the log of the Compare Performance - ${{ inputs.pull-request-id }} job. The performance graphs may not have updated."
          exit 1

  # BuildAndTest counts as passed when skipped only because Configure chose no
  # entry to build.
  Complete:
    runs-on: ubuntu-latest
    name: Complete ${{ inputs.pull-request-id }}
    needs: [ Configure, BuildAndTest, ComparePerformance ]
    if: >
      !cancelled() &&
      needs.Configure.result == 'success' &&
      (needs.BuildAndTest.result == 'success' ||
        (needs.BuildAndTest.result == 'skipped' && needs.Configure.outputs.build == 'false')) &&
      (needs.ComparePerformance.result == 'success' || needs.ComparePerformance.result == 'skipped')
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.org-name }}/common-ci
          ref: ${{ inputs.common-ci-ref }}

      - name: Complete
        env:
          CI_ACCESS_TOKEN: ${{ secrets.CI_ACCESS_TOKEN }}
        run: |
          $DryRun = [bool]::Parse( "${{ inputs.dryrun }}" )
          ./nightly-pull-request.complete.ps1 `
          -RepoName ${{ inputs.repo-name }} `
          -OrgName ${{ inputs.org-name }} `
          -PullRequestId ${{ inputs.pull-request-id }} `
          -Branch ${{ inputs.branch != '' && inputs.branch || github.ref_name }} `
          -DryRun $DryRun
