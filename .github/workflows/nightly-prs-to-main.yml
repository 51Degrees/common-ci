# TODO: switch all repos to the new file name (`nightly-publish.yml`), and delete this file
#
name: Nightly Pull Requests

on:
  workflow_call:
    inputs:
      repo-name:
        type: string
        required: true
      org-name:
        type: string
        default: 51Degrees
      user:
        type: string
        default: Automation51D
      email:
        type: string
        default: 51DCI@51degrees.com
      dryrun:
        type: string
        default: false
      cache-assets:
        type: boolean
      common-ci-ref:
        type: string
        default: ''
      prs: # Comma-separated list of pull request IDs to build
        type: string
      branch: # Branch to use if not one calling this
        type: string
        default: ''
      build-test-timeout-minutes:
        type: number
        default: 120
      skip-compare-performance:
        type: boolean
        default: false
    secrets:
      token:
        required: true
      AcceptCHBrowserKey:
      AcceptCHHardwareKey:
      AcceptCHNoneKey:
      AcceptCHPlatformKey:
      ApiKey:
      CsvUrl:
      DeviceDetection:
      DeviceDetectionUrl:
      IpIntelligence:
      IpIntelligenceUrl:
      JavaGpgKeyPassphrase:
      JavaPGP:
      MavenSettings:
      NPMAuthToken:
      NginxCert:
      NginxKey:
      NginxJwtToken:
      PypiToken:
      ResourceKeyCloudV5Bespoke:
      StrongNameKeyBase64:
      TestBrowserResourceKey:
      TestHardwareResourceKey:
      TestLicenseKey:
      TestNoSetHeaderResourceKey:
      TestPlatformResourceKey:
      TestPypiToken:
      TestResourceKey:
      TestSuperResourceKey:
      UsePublishTests:
      PearlLicense:

defaults:
  run:
    shell: pwsh
    working-directory: ./common

jobs:
  # Get the pull requests into the branch the nightly works on. Where the
  # repository takes changes through rc that is rc, so nothing is built for or
  # merged into the default branch.
  GetPullRequests:
    name: Get Pull Requests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.org-name }}/common-ci
          path: common
          ref: ${{ inputs.common-ci-ref }}

      # Output the branch and the ids of the pull requests into it
      - name: Get Pull Requests
        id: get_pull_requests
        env:
          PULL_REQUEST_IDS: ${{ inputs.prs }}
        run: |
          ./nightly-pull-requests.get-prs.ps1 `
          -RepoName ${{ inputs.repo-name }} `
          -OrgName ${{ inputs.org-name }} `
          -Branch ${{ inputs.branch != '' && inputs.branch || github.ref_name }} `
          -GitHubToken ${{ secrets.token }} `
          -GitHubOutput $Env:GITHUB_OUTPUT
    outputs:
      pull_request_ids: ${{ steps.get_pull_requests.outputs.pull_request_ids }}
      branch: ${{ steps.get_pull_requests.outputs.branch }}

  # Run the common workflow on each pull request
  NightlyPullRequest:
    needs: GetPullRequests
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.GetPullRequests.outputs.pull_request_ids) }}
    name: Nightly PR - ${{ matrix.id }}
    uses: ./.github/workflows/nightly-pull-request.yml
    with:
      repo-name: ${{ inputs.repo-name }}
      org-name: ${{ inputs.org-name }}
      pull-request-id: ${{ matrix.id }}
      user: ${{ inputs.user }}
      email: ${{ inputs.email }}
      dryrun: ${{ inputs.dryrun }}
      cache-assets: ${{ inputs.cache-assets }}
      common-ci-ref: ${{ inputs.common-ci-ref }}
      branch: ${{ needs.GetPullRequests.outputs.branch }}
      # The history to compare performance against is the branch the nightly
      # runs for, as only that branch's publish runs record it.
      performance-branch: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}
      build-test-timeout-minutes: ${{ inputs.build-test-timeout-minutes }}
      skip-compare-performance: ${{ inputs.skip-compare-performance }}
    secrets: inherit
