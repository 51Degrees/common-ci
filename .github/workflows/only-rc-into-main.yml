name: Only rc into main

# Fails a pull request into the repository's default branch, which is main in
# most repositories, unless it comes from the same repository's rc branch, so
# changes reach the default branch together, as one release. A pull request
# into any other branch passes. Every public repository calls it on every pull
# request from a workflow and job both named "Only rc into main", which makes
# the check "Only rc into main / check" everywhere:
#
#   on:
#     pull_request:
#   jobs:
#     rc:
#       name: Only rc into main
#       uses: 51Degrees/common-ci/.github/workflows/only-rc-into-main.yml@main
#       with:
#         publishes-packages: true
#
# In a repository that publishes packages, which says so with the
# publishes-packages input, it also fails a release, being a pull request from
# rc into the default branch, that comes less than a week after the last one
# merged, unless the label early-release is on it, as CONTRIBUTING.md explains
# under "Releasing at most once a week".

on:
  workflow_call:
    inputs:
      common-ci-ref:
        description: 'The common-ci ref to take the release check from. Empty means its default branch.'
        type: string
        default: ''
      publishes-packages:
        description: 'Whether the repository publishes packages, to a registry or as the versions other packages are built from, so that a release from rc is held to one a week.'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Reads the repository's pull requests and their labels, and nothing else.
    permissions:
      contents: read
      pull-requests: read
    env:
      _51DEGREES_BASE: ${{ github.base_ref }}
      _51DEGREES_HEAD: ${{ github.head_ref }}
      _51DEGREES_DEFAULT: ${{ github.event.repository.default_branch }}
      _51DEGREES_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      _51DEGREES_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Refuse a pull request into the default branch from any branch but rc
        run: |
          if [ "$_51DEGREES_BASE" = "$_51DEGREES_DEFAULT" ] && { [ "$_51DEGREES_HEAD" != "rc" ] || [ "$_51DEGREES_HEAD_REPOSITORY" != "$_51DEGREES_REPOSITORY" ]; }; then
            echo "::error title=Only rc merges into $_51DEGREES_DEFAULT::This pull request merges $_51DEGREES_HEAD_REPOSITORY:$_51DEGREES_HEAD into $_51DEGREES_DEFAULT. Open it against rc instead, as only rc merges into $_51DEGREES_DEFAULT."
            exit 1
          fi
          echo "$_51DEGREES_HEAD_REPOSITORY:$_51DEGREES_HEAD into $_51DEGREES_BASE is allowed."

      # A repository that publishes packages, to a registry or as the
      # versions other packages are built from, says so with the
      # publishes-packages input. Only its releases are held to one a week.
      - name: Find whether this is a release of packages
        id: release
        env:
          _51DEGREES_PUBLISHES_PACKAGES: ${{ inputs.publishes-packages }}
        run: |
          release=false
          if [ "$_51DEGREES_BASE" = "$_51DEGREES_DEFAULT" ] && [ "$_51DEGREES_HEAD" = "rc" ] && [ "$_51DEGREES_HEAD_REPOSITORY" = "$_51DEGREES_REPOSITORY" ] && [ "$_51DEGREES_PUBLISHES_PACKAGES" = "true" ]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "A release of packages: $release."

      - name: Checkout the release check
        if: steps.release.outputs.release == 'true'
        uses: actions/checkout@v6
        with:
          repository: 51Degrees/common-ci
          ref: ${{ inputs.common-ci-ref }}
          path: common-ci
          sparse-checkout: steps
          persist-credentials: false

      - name: Refuse a release less than a week after the last
        if: steps.release.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          _51DEGREES_NUMBER: ${{ github.event.pull_request.number }}
          # The calling repository's variable, or the organisation's.
          _51DEGREES_WEEKLY_RELEASES_FROM: ${{ vars._51DEGREES_WEEKLY_RELEASES_FROM }}
          _51DEGREES_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./common-ci/steps/check-release-pull-request.ps1 `
            -Repository $env:_51DEGREES_REPOSITORY -PullRequest $env:_51DEGREES_NUMBER `
            -DefaultBranch $env:_51DEGREES_DEFAULT -RunUrl $env:_51DEGREES_RUN_URL
