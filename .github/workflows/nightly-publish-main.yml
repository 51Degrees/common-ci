#
# TODO: switch all repos to the new file name (`nightly-publish.yml`), and delete this file
#
name: Nightly Publish

on:
  workflow_call:
    inputs:
      repo-name:
        type: string
        required: true
      build-platform:
        type: string
        default: ubuntu-latest
      org-name:
        type: string
        default: 51degrees
      user:
        type: string
        default: Automation51D
      email:
        type: string
        default: "51DCI@51Degrees.com"
      dryrun:
        type: boolean
        default: false
      cache-assets:
        type: boolean
        default: false
      common-ci-ref:
        type: string
        default: ''
      skip-compare-performance:
        type: boolean
        default: false

defaults:
  run:
    shell: pwsh

jobs:
  Configure:
    runs-on: ubuntu-latest
    outputs:
      asset_cache_key: ${{ steps.prefetch-assets.outputs.cache-key }}
      options: ${{ steps.configure.outputs.options }}
      runperformance: ${{ steps.configure.outputs.runperformance }}
      version: ${{ steps.configure.outputs.version }}
      update_required: ${{ steps.configure.outputs.update_required }}
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.org-name }}/common-ci
          ref: ${{ inputs.common-ci-ref }}

      - name: Install GitVersion
        run: ./steps/install-gitversion.ps1

      - name: Configure
        id: configure
        env:
          CI_ACCESS_TOKEN: ${{ secrets.CI_ACCESS_TOKEN }}
        run: |
          ./nightly-publish.configure.ps1 `
          -RepoName ${{ inputs.repo-name }} `
          -OrgName ${{ inputs.org-name }} `
          -Branch ${{ github.ref_name }} `
          -GitHubOutput $Env:GITHUB_OUTPUT `
          -GitHubUser ${{ inputs.user }} `
          -GitHubEmail ${{ inputs.email }} `
          -BuildPlatform ${{ inputs.build-platform }}

      - name: Prefetch assets
        id: prefetch-assets
        if: inputs.cache-assets
        uses: ./.github/actions/prefetch_assets
        with:
          repo: ${{ inputs.repo-name }}
          secrets: ${{ toJSON(secrets) }}
          vars: ${{ toJSON(vars) }}
          license-key: ${{ secrets.LICENSE_KEY_V4TAC_IPIV4ENTERPRISE }}

  PreBuild:
    needs: Configure
    strategy:
      matrix:
        options: ${{ fromJSON(needs.configure.outputs.options ) }}
    name: Pre Build - ${{ matrix.options.name }}
    runs-on: ${{ matrix.options.image }}
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        if: ${{ matrix.options.packagerequirement }}
        with:
          repository: ${{ inputs.org-name }}/common-ci
          ref: ${{ inputs.common-ci-ref }}

      - name: Install Runtime
        if: matrix.options.Language != '' && matrix.options.LanguageVersion != ''
        uses: ./.github/actions/install_runtime
        with:
          language: ${{ matrix.options.Language }}
          version: ${{ matrix.options.LanguageVersion }}

      # The secrets and variables, each under its own name, for the
      # steps that follow. The secrets context is read here alone.
      - name: Export secrets and variables
        if: ${{ matrix.options.packagerequirement }}
        env:
          _51DEGREES_SECRETS: ${{ toJSON(secrets) }}
          _51DEGREES_VARS: ${{ toJSON(vars) }}
        run: ./steps/export-secrets.ps1 -Secrets $env:_51DEGREES_SECRETS -Vars $env:_51DEGREES_VARS

      - name: PreBuild
        if: ${{ matrix.options.packagerequirement }}
        run: |
          $DryRun = [bool]::Parse( "${{ inputs.dryrun }}" )
          $Options = $(ConvertFrom-Json -AsHashtable '${{ toJSON(matrix.options) }}')
          ./nightly-publish.prebuild.ps1 `
          -RepoName ${{ inputs.repo-name }} `
          -OrgName ${{ inputs.org-name }} `
          -Branch ${{ github.ref_name }} `
          -Options $Options `
          -GitHubUser ${{ inputs.user }} `
          -GitHubEmail ${{ inputs.email }} `
          -DryRun $DryRun

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v7
        if: ${{ success() && matrix.options.packagerequirement }}
        with:
          name: package_${{ matrix.options.name }}
          path: ${{ github.workspace }}/package-files
          if-no-files-found: ignore
          include-hidden-files: true


  Build:
    runs-on: ${{ inputs.build-platform }}
    needs: [ PreBuild, Configure ]
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.org-name }}/common-ci
          ref: ${{ inputs.common-ci-ref }}

      - name: Download Package Artifacts
        if: ${{ success() }}
        uses: actions/download-artifact@v8
        with:
          pattern: package_*
          path: ${{ github.workspace }}/package-files

      # The secrets and variables, each under its own name, for the
      # steps that follow. The secrets context is read here alone.
      # This job signs the packages it builds, so it takes the signing names.
      - name: Export secrets and variables
        env:
          _51DEGREES_SECRETS: ${{ toJSON(secrets) }}
          _51DEGREES_VARS: ${{ toJSON(vars) }}
        run: ./steps/export-secrets.ps1 -Secrets $env:_51DEGREES_SECRETS -Vars $env:_51DEGREES_VARS -Sign

      - name: Build
        run: |
          $DryRun = [bool]::Parse( "${{ inputs.dryrun }}" )
          $Options = @{}
          $Options.Add("Version", "${{ needs.configure.outputs.version }}")
          ./nightly-publish.build.ps1 `
          -RepoName ${{ inputs.repo-name }} `
          -OrgName ${{ inputs.org-name }} `
          -Branch ${{ github.ref_name }} `
          -Options $Options `
          -GitHubUser ${{ inputs.user }} `
          -GitHubEmail ${{ inputs.email }} `
          -DryRun $DryRun

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: package
          path: ${{ github.workspace }}/package
          if-no-files-found: ignore
          include-hidden-files: true


  Test:
    needs: [ Build, Configure ]
    strategy:
      matrix:
        options: ${{ fromJSON(needs.configure.outputs.options ) }}
    name: Test - ${{ matrix.options.name }}
    runs-on: ${{ matrix.options.image }}
    timeout-minutes: 120

    steps:
      - name: Checkout Common
        if: ${{ matrix.options.packagerequirement }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.org-name }}/common-ci
          ref: ${{ inputs.common-ci-ref }}

      - name: Download Package Artifact
        if: ${{ success() && matrix.options.packagerequirement }}
        uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ github.workspace }}/package

      - name: Install Runtime
        if: matrix.options.Language != '' && matrix.options.LanguageVersion != ''
        uses: ./.github/actions/install_runtime
        with:
          language: ${{ matrix.options.Language }}
          version: ${{ matrix.options.LanguageVersion }}

      - name: Restore Asset Cache
        if: needs.configure.outputs.asset_cache_key
        uses: actions/cache/restore@v5
        with:
          key: ${{ needs.configure.outputs.asset_cache_key }}
          path: assets
          enableCrossOsArchive: true

      # The secrets and variables, each under its own name, for the
      # steps that follow. The secrets context is read here alone.
      - name: Export secrets and variables
        if: ${{ success() && matrix.options.packagerequirement }}
        env:
          _51DEGREES_SECRETS: ${{ toJSON(secrets) }}
          _51DEGREES_VARS: ${{ toJSON(vars) }}
        run: ./steps/export-secrets.ps1 -Secrets $env:_51DEGREES_SECRETS -Vars $env:_51DEGREES_VARS

      - name: Test
        if: ${{ success() && matrix.options.packagerequirement }}
        env:
          # The data file license, for the data file downloads and the data
          # file update example tests that this step runs.
          _51DEGREES_LICENSE_KEY: ${{ secrets.LICENSE_KEY_V4TAC_IPIV4ENTERPRISE }}
        run: |
          $DryRun = [bool]::Parse( "${{ inputs.dryrun }}" )
          $Options = $(ConvertFrom-Json -AsHashtable '${{ toJSON(matrix.options) }}')
          ./nightly-publish.test.ps1 `
          -RepoName ${{ inputs.repo-name }} `
          -OrgName ${{ inputs.org-name }} `
          -Branch ${{ github.ref_name }} `
          -Options $Options `
          -GitHubUser ${{ inputs.user }} `
          -GitHubEmail ${{ inputs.email }} `
          -DryRun $DryRun

      - name: Upload Performance Results Artifact
        uses: actions/upload-artifact@v7
        if: ${{ matrix.options.RunPerformance }}
        with:
          name: performance_results-publish-${{ matrix.options.name }}
          path: ${{ inputs.repo-name }}/test-results/performance-summary/results_*.json

      - name: Publish Test Results
        if: ${{ !cancelled() && matrix.options.packagerequirement }}
        uses: ./.github/actions/publish_test_results
        with:
          repo-name: ${{ inputs.repo-name }}
          name: ${{ matrix.options.name }}
          skip-unit: true
          skip-performance: true

  ComparePerformance:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-compare-performance && needs.Configure.outputs.runperformance }}
    needs: [Configure, Test]
    outputs:
      outcome: ${{ steps.compare.outcome }}
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.org-name }}/common-ci
          ref: ${{ inputs.common-ci-ref }}

      - name: Download Performance Results Artifact
        uses: actions/download-artifact@v8
        with:
          pattern: performance_results-publish-*
          merge-multiple: true

      # A failed comparison must not stop a merge or a release, because figures
      # vary too much between runners. ReportComparePerformance turns the run red.
      - name: Compare Performance
        id: compare
        continue-on-error: true
        env:
          CI_ACCESS_TOKEN: ${{ secrets.CI_ACCESS_TOKEN }}
        run: |
          ./nightly-publish.compare-performance.ps1 `
          -RepoName '${{ inputs.repo-name }}' `
          -OrgName '${{ inputs.org-name }}' `
          -Branch '${{ github.ref_name }}' `
          -GitHubOutput $Env:GITHUB_OUTPUT `
          -Options (ConvertFrom-Json -AsHashtable '${{ needs.Configure.outputs.options }}') `
          -RunId '${{ github.run_id }}' `
          -GitHubUser '${{ inputs.user }}' `
          -GitHubEmail '${{ inputs.email }}' `
          -DryRun ([bool]::Parse('${{ inputs.dryrun }}'))

      - name: Escape Branch Name
        id: escape_branch
        run: |
          "name=" + $env:GITHUB_REF_NAME -replace '[":<>|*?/\\\r\n]', '-' | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload Performance Results Artifact
        uses: actions/upload-artifact@v7
        with:
          name: publish_performance_results@${{ steps.escape_branch.outputs.name }} # https://github.com/actions/upload-artifact/issues/22
          path: ${{ github.workspace }}/results_*.json
          if-no-files-found: ignore
          include-hidden-files: true

  ReportComparePerformance:
    name: Report Compare Performance
    runs-on: ubuntu-latest
    needs: ComparePerformance
    if: ${{ !cancelled() && needs.ComparePerformance.outputs.outcome == 'failure' }}
    steps:
      - name: Report Failure
        run: |
          Write-Output "::error title=Compare Performance failed::See the log of the ComparePerformance job. The performance graphs may not have updated."
          exit 1

  Package:
    runs-on: ${{ inputs.build-platform }}
    needs: [Configure, Test, ComparePerformance]
    if: >
      !cancelled() && needs.Configure.outputs.update_required == 'true' &&
      needs.Test.result == 'success' &&
      (needs.ComparePerformance.result == 'success' || needs.ComparePerformance.result == 'skipped')
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.org-name }}/common-ci
          ref: ${{ inputs.common-ci-ref }}

      - name: Download Package Artifact
        if: ${{ success() }}
        uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ github.workspace }}/package

      # The secrets and variables, each under its own name, for the
      # steps that follow. The secrets context is read here alone.
      # This job publishes the packages, so it takes the publishing names.
      - name: Export secrets and variables
        if: ${{ success() }}
        env:
          _51DEGREES_SECRETS: ${{ toJSON(secrets) }}
          _51DEGREES_VARS: ${{ toJSON(vars) }}
        run: ./steps/export-secrets.ps1 -Secrets $env:_51DEGREES_SECRETS -Vars $env:_51DEGREES_VARS -Publish

      - name: Package
        if: ${{ success() }}
        run: |
          $DryRun = [bool]::Parse( "${{ inputs.dryrun }}" )
          $Options = @{}
          $Options.Add("Version", "${{ needs.configure.outputs.version }}")
          ./nightly-publish.package.ps1 `
          -RepoName ${{ inputs.repo-name }} `
          -OrgName ${{ inputs.org-name }} `
          -Branch ${{ github.ref_name }} `
          -Options $Options `
          -GitHubUser ${{ inputs.user }} `
          -GitHubEmail ${{ inputs.email }} `
          -DryRun $DryRun
