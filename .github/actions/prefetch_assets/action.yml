name: Prefetch assets
inputs:
  secrets:
    required: true # should be converted with toJSON()
  vars:
    required: true # should be converted with toJSON()
  repo:
    default: .
  license-key:
    # The license key the data files are downloaded with, from the secret
    # that carries the data file products. Set as _51DEGREES_LICENSE_KEY for
    # the download step alone.
    required: false
    default: ''
  save-free-data:
    # Saves the free data files' cache entry. Set only by the workflows that
    # run main's own scripts, so a pull request's script cannot write an
    # entry that main's runs restore.
    required: false
    default: 'false'
outputs:
  cache-key:
    value: ${{ steps.hash-assets.outputs.key }}
runs:
  using: "composite"
  steps:
      - name: Hash assets
        id: hash-assets
        shell: pwsh
        env:
          _51DEGREES_REPO: ${{ inputs.repo }}
        run: |
          $ErrorActionPreference = 'Stop'
          $key = & "${{ github.action_path }}/../../../steps/prefetch-cache-key.ps1" `
              -FetchScript "$env:_51DEGREES_REPO/ci/fetch-assets.ps1"
          "key=$key" >> $env:GITHUB_OUTPUT

      - name: Check if cached
        id: check-cache
        uses: actions/cache/restore@v5
        with:
          key: ${{ steps.hash-assets.outputs.key }}
          path: assets
          lookup-only: true

      # The free data files have a cache entry of their own, restored into
      # the data repository's clone before the repository's script runs, so
      # a change to the repository's asset list does not download them again.
      - name: Hash the free data files
        id: hash-free-data
        shell: pwsh
        if: ${{ !steps.check-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = & "${{ github.action_path }}/../../../steps/data-repository.ps1"
          $key = & "${{ github.action_path }}/../../../steps/free-data-cache-key.ps1" -Repository $repository
          "key=$key" >> $env:GITHUB_OUTPUT

      - name: Restore the free data files
        id: restore-free-data
        if: ${{ !steps.check-cache.outputs.cache-hit }}
        uses: actions/cache/restore@v5
        with:
          key: ${{ steps.hash-free-data.outputs.key }}
          path: |
            ${{ runner.temp }}/51degrees-data/*
            !${{ runner.temp }}/51degrees-data/.git

      # The secrets and variables go into the environment under
      # their own names, as in the build jobs. The export takes neither the
      # publishing nor the signing names, nor the data file license.
      - name: Export secrets
        shell: pwsh
        if: ${{ !steps.check-cache.outputs.cache-hit }}
        env:
          _51DEGREES_SECRETS: ${{ inputs.secrets }}
          _51DEGREES_VARS: ${{ inputs.vars }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "${{ github.action_path }}/../../../steps/export-secrets.ps1" -Secrets $env:_51DEGREES_SECRETS -Vars $env:_51DEGREES_VARS

      # The repository's script runs in a step of its own, with the exported
      # names and without the secrets context. It reads the data file license
      # as _51DEGREES_LICENSE_KEY, set here from the license-key input.
      - name: Prefetch assets
        id: prefetch-assets
        shell: pwsh
        if: ${{ !steps.check-cache.outputs.cache-hit }}
        env:
          _51DEGREES_REPO: ${{ inputs.repo }}
          _51DEGREES_LICENSE_KEY: ${{ inputs.license-key }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:_51DEGREES_REPO/ci/fetch-assets.ps1"

      - name: Cache assets
        if: steps.prefetch-assets.conclusion == 'success'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.hash-assets.outputs.key }}
          path: assets
          enableCrossOsArchive: true

      # Saved from main, so that a pull request reads main's entry.
      - name: Cache the free data files
        if: >-
          inputs.save-free-data == 'true' &&
          steps.prefetch-assets.conclusion == 'success' &&
          steps.restore-free-data.outputs.cache-hit != 'true' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.hash-free-data.outputs.key }}
          path: |
            ${{ runner.temp }}/51degrees-data/*
            !${{ runner.temp }}/51degrees-data/.git
