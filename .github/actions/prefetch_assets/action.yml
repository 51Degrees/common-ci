name: Prefetch assets
inputs:
  secrets:
    required: true # should be converted with toJSON()
  vars:
    required: true # should be converted with toJSON()
  repo:
    default: .
outputs:
  cache-key:
    value: ${{ steps.hash-assets.outputs.key }}
runs:
  using: "composite"
  steps:
      - name: Hash assets
        id: hash-assets
        shell: pwsh
        env:
          _51DEGREES_REPO: ${{ inputs.repo }}
          _51DEGREES_SECRETS: ${{ inputs.secrets }}
        run: |
          $sha1 = [Security.Cryptography.SHA1Managed]::new()
          # Select-Object -ExcludeProperty against a hashtable returns an object
          # with no Values member, so this whole expression used to evaluate to
          # an empty string and every key carried SHA1("") - the secrets never
          # took part in the key at all. Drop the token from the hashtable
          # itself instead.
          $secretValues = $env:_51DEGREES_SECRETS | ConvertFrom-Json -AsHashtable
          $null = $secretValues.Remove('github_token')
          $key = $secretValues.Values | Sort-Object | Join-String -Separator `n
          # Fold the repo's fetch-assets script into the key, because it is what
          # decides which assets are downloaded. Keying on the secrets alone means
          # the key only rotates once a day, so an entry written before an asset
          # was added to the list keeps being restored for the rest of that day.
          # The prefetch step is then skipped on a cache hit and the new asset is
          # silently missing from the restored cache.
          $key += "`n" + (Get-Content -Raw "$env:_51DEGREES_REPO/ci/fetch-assets.ps1")
          $hash = [Convert]::ToHexString($sha1.ComputeHash([Text.Encoding]::Utf8.GetBytes($key)))
          "key=$(Get-Date -Format FileDate)-$hash" >> $env:GITHUB_OUTPUT

      - name: Check if cached
        id: check-cache
        uses: actions/cache/restore@v5
        with:
          key: ${{ steps.hash-assets.outputs.key }}
          path: assets
          lookup-only: true

      # The _51DEGREES_ secrets and variables go into the environment under
      # their own names, as in the build jobs, so the repository's
      # fetch-assets.ps1 reads _51DEGREES_LICENSE_KEY from there. The export
      # takes neither the publishing nor the signing names.
      - name: Export secrets
        shell: pwsh
        if: ${{ !steps.check-cache.outputs.cache-hit }}
        env:
          _51DEGREES_SECRETS: ${{ inputs.secrets }}
          _51DEGREES_VARS: ${{ inputs.vars }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "${{ github.action_path }}/../../../steps/export-secrets.ps1" -Secrets $env:_51DEGREES_SECRETS -Vars $env:_51DEGREES_VARS

      # The repository's script runs in a step of its own, with the exported
      # names and without the secrets context.
      - name: Prefetch assets
        id: prefetch-assets
        shell: pwsh
        if: ${{ !steps.check-cache.outputs.cache-hit }}
        env:
          _51DEGREES_REPO: ${{ inputs.repo }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:_51DEGREES_REPO/ci/fetch-assets.ps1"

      - name: Cache assets
        if: steps.prefetch-assets.conclusion == 'success'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.hash-assets.outputs.key }}
          path: assets
          enableCrossOsArchive: true
